# Menjaga model AI tetap sehat: menjalankan seluruh test tiap ada perubahan di ai-service.
name: AI service

on:
  push:
    branches: [main]
    paths:
      - "ai-service/**"
      - ".github/workflows/ai-service.yml"
  pull_request:
    paths:
      - "ai-service/**"
      - ".github/workflows/ai-service.yml"
  workflow_dispatch:

jobs:
  test:
    name: Test & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt

      - name: Pasang dependensi
        run: pip install -r requirements-dev.txt

      - name: Test
        run: python -m pytest -q

      - name: Lint
        run: ruff check app tests scripts

      - name: Pastikan contoh payload untuk BE tetap valid
        run: python -c "import json,pathlib; json.loads(pathlib.Path('examples/solve-request.example.json').read_text(encoding='utf-8')); print('contoh payload OK')"

  docker:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t sipenta-ai:ci ai-service
