# SIPENTA memakai Supabase CLOUD (tanpa Docker). File ini TIDAK menjalankan stack lokal
# (`supabase start` tidak dipakai). Setting auth/storage yang berlaku diatur di dashboard
# supabase.com → Settings. Blok di bawah hanya jadi acuan bila suatu saat pindah ke lokal.
project_id = "sipenta"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "sipenta://auth-callback"]
jwt_expiry = 3600
enable_signup = false          # user dibuat oleh admin, bukan self-signup

[auth.email]
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "10MiB"

[edge_runtime]
enabled = true
